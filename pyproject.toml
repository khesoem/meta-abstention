[project]
name = "meta-abstention"
version = "0.1.0"
description = ""
authors = [
    {name = "khaes-kth",email = "khaes@kth.se"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=3.0.0",
    "openai>=1.0.0",
    "scipy (>=1.18.0,<2.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "transformers (>=5.15.0,<6.0.0)",
    "code-bert-score (>=0.4.1,<0.5.0)",
    "codebleu (>=0.7.0,<0.8.0)",
    "tree-sitter-python (>=0.25.0,<0.26.0)",
]


[project.scripts]
meta-abstention = "meta_abstention.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
